<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamina chart specimens VII</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../formats/abstract/kit/ga-kit.css">
<script src="../formats/abstract/kit/icons.js"></script>
<script src="../formats/abstract/kit/ga-kit.js"></script>
<script src="../formats/abstract/kit/ga-charts.js"></script>
</head>
<body>
<script>
// Specimen sheet for core/charts.md: a cohort's records drawn as glyphs. The
// swimmer plot (25) and unit columns (26). All data here are synthetic.
GA.build({ duration: 8, poster: 7.5, title: "Lamina chart specimens VII", desc: "A cohort's clinical course and samples drawn with one glyph vocabulary: a swimmer plot and unit columns, on synthetic data." }, (ga) => {
  const tok = (n) => getComputedStyle(document.documentElement).getPropertyValue(`--${n}`).trim();
  const rnd = GA.rng(11);
  const at = 0.3, T = 138;
  ga.text("LAMINA · CHART SPECIMENS VII · SYNTHETIC DATA", { x: ga.M, y: 40, role: "kicker", at: 0 });
  ga.text("A cohort's course, one glyph each", { x: ga.M, y: 64, role: "title", size: 34, at: 0 });
  ga.hrule(118);
  const note = (x, w, s) => ga.text(s, { x, y: 722, w, role: "cap", size: 14, at: 0.4 });

  // colour has one job here: the sampled site, as on the body map (form 22).
  const site = { lung: tok("organ-lungs"), liver: tok("organ-liver"), adrenal: tok("organ-adrenal"), kidney: tok("organ-kidney"), other: tok("ink-2") };
  const siteKeys = Object.keys(site);
  // treatments are slate steps; the strips use hues no site uses here
  const tx = { chemo: tok("slate-700"), immuno: tok("slate-400"), targeted: tok("slate-200") };
  const histo = [tok("violet-600"), tok("rose-500"), tok("context")], stage = [tok("teal-300"), tok("teal-500"), tok("teal-700")], smoke = [tok("wash"), tok("slate-400"), tok("slate-800")];

  // 25 swimmer plot
  {
    const x = ga.M;
    ga.text("25 · SWIMMER PLOT", { x, y: T, role: "step", at: 0.2 });
    const n = 14, rows = [];
    for (let i = 0; i < n; i++) {
      const end = Math.round(300 + (2600 * (i + rnd() * 0.6)) / n), rel = Math.round(end * (0.25 + 0.4 * rnd()));
      const events = [{ t: 0, kind: "diamond", fill: "var(--prussian)", text: String(2 + Math.floor(rnd() * 7)), size: 13 }];
      if (rnd() < 0.6) for (let c = 0; c < 2 + Math.floor(rnd() * 3); c++) events.push({ t: 50 + c * 32, kind: "circle", fill: "var(--context)", size: 7 });
      events.push({ t: rel, kind: "cross", size: 10 });
      if (rnd() < 0.7) events.push({ t: rel + 40, kind: "triangle", fill: "var(--paper)", ring: "var(--ink)", size: 11 });
      const bars = [];
      let t0 = rel + 90;
      for (const k of ["chemo", "immuno", "targeted"]) {
        if (rnd() < 0.55 && t0 < end - 120) { const t1 = Math.min(end - 60, t0 + 100 + rnd() * 500); bars.push({ t0, t1, color: tx[k] }); t0 = t1 + 60; }
      }
      if (rnd() < 0.5 && t0 < end - 60) events.push({ t: t0 + 20, kind: "square", fill: "var(--paper)", ring: "var(--ink)", size: 10 });
      if (rnd() < 0.6) events.push({ t: Math.round(rel + (end - rel) * rnd()), kind: "diamond", fill: "var(--ink)", size: 8 });
      const ns = 3 + Math.floor(rnd() * 12);
      const samples = Array.from({ length: ns }, (_, k) => site[siteKeys[k < ns * 0.4 ? 0 : Math.floor(rnd() * siteKeys.length)]]);
      rows.push({ label: `P-${String(11 + i * 7).padStart(2, "0")}`, end, dead: true, events, bars, samples, strips: [histo[Math.floor(rnd() * 3)], stage[Math.floor(rnd() * 3)], smoke[Math.floor(rnd() * 3)]] });
    }
    const X0 = x + 144, pitch = 22;
    const ch = GA.chart(ga, { x: X0, y: T + 96, w: 600, h: n * pitch, xd: [0, 3000], xTicks: [0, 1000, 2000, 3000], xFmt: (v) => v.toLocaleString("en-GB"), xTitle: "Days after surgery", axes: "x", at });
    ch.swimmer(rows, { stripX: [x + 60, x + 60 + pitch, x + 60 + 2 * pitch], stripLabels: ["Histology", "Stage", "Smoking"] });
    // keys: events and treatment right of the plot; strips and samples beneath
    const kx = X0 + 700; // keys
    const ky = GA.glyphKey(ga, [
      { kind: "diamond", fill: "var(--prussian)", text: "4", size: 13, label: "surgery (regions)" },
      { kind: "circle", fill: "var(--context)", size: 7, label: "adjuvant cycle" },
      { kind: "cross", size: 10, label: "relapse" },
      { kind: "triangle", fill: "var(--paper)", ring: "var(--ink)", size: 11, label: "relapse sample" },
      { kind: "square", fill: "var(--paper)", ring: "var(--ink)", size: 10, label: "progression sample" },
      { kind: "diamond", fill: "var(--ink)", size: 8, label: "radiotherapy" },
      { kind: "tick", size: 12, label: "death" },
    ], { x: kx, y: T + 30, title: "Event", at });
    GA.glyphKey(ga, [{ bar: tx.chemo, label: "chemotherapy" }, { bar: tx.immuno, label: "immunotherapy" }, { bar: tx.targeted, label: "targeted" }], { x: kx, y: ky + 12, title: "Treatment", at });
    const key = (title, labels, cols, xx) => GA.glyphKey(ga, labels.map((l, i) => ({ kind: "square", fill: cols[i], size: 10, ring: cols[i] === tok("wash") ? "var(--context)" : undefined, ringW: 1, label: l })), { x: xx, y: ch.y1 + 58, pitch: 18, title, at });
    key("Histology", ["LUAD", "LUSC", "other"], histo, x);
    key("Stage", ["I", "II", "III"], stage, x + 130);
    key("Smoking", ["never", "ex", "current"], smoke, x + 240);
    GA.glyphKey(ga, siteKeys.map((k) => ({ kind: "circle", fill: site[k], size: 9, label: k === "other" ? "other site" : k })), { x: x + 370, y: ch.y1 + 58, pitch: 18, title: "Autopsy sample", at });
    note(x, 960, "One row per patient, shortest survival first. Shape says what happened (surgery, relapse, a sample, death), a digit inside how many, and treatment runs as slate bars on the follow-up line. Colour has one job: the sampled site, the same as on the body map, so each row ends with its autopsy samples coloured where they came from.");
  }

  // 26 unit columns: metastases per patient, by what was done with each
  {
    const x = ga.M + 1040, CW = 1600 - ga.M - x;
    ga.text("26 · UNIT COLUMNS", { x, y: T, role: "step", at: 0.2 });
    const cols = Array.from({ length: 14 }, (_, j) => {
      const tot = 2 + Math.round(j * 1.25 + rnd() * 3), both = Math.round(tot * (0.3 + 0.4 * rnd())), smp = Math.round((tot - both) * rnd());
      return { label: `P-${String(11 + j * 7).padStart(2, "0")}`, parts: [both, smp, tot - both - smp], tot };
    }).sort((a, b) => a.tot - b.tot);
    const ch = GA.chart(ga, { x: x + 34, y: T + 100, w: 360, h: 360, xd: [-0.5, 13.5], yd: [0, 20], yTicks: [0, 5, 10, 15, 20], yTitle: "Metastases", axes: "y", at });
    ch.units(cols, [tok("prussian"), tok("blue-200"), "hollow"]);
    const kx = ch.dotKey([{ label: "imaged and sampled", color: tok("prussian") }, { label: "sampled only", color: tok("blue-200") }], { x, y: T + 26 });
    ga.raw(GA.glyph("circle", kx + 6, T + 34, { size: 11, fill: "var(--paper)", ring: "var(--ink-2)", ringW: 1 }), { at, anim: "fade" });
    ga.text("imaged only", { x: kx + 18, y: T + 26, role: "tick", at, anim: "fade" });
    note(x, CW, "One dot per metastasis, so the column's height counts them and its make-up shows at once. States stack in one order from the baseline; the lightest is hollow. Columns sort by total.");
  }
});
</script>
</body>
</html>
