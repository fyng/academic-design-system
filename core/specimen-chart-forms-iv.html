<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamina chart specimens IV</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../formats/abstract/kit/ga-kit.css">
<script src="../formats/abstract/kit/icons.js"></script>
<script src="../formats/abstract/kit/ga-kit.js"></script>
<script src="../formats/abstract/kit/ga-charts.js"></script>
</head>
<body>
<script>
// Specimen sheet for core/charts.md: the count matrix (18), the dot matrix (19)
// and the radial track stack (21). All data here are synthetic.
GA.build({ duration: 8, poster: 7.5, title: "Lamina chart specimens IV", desc: "Matrix and ring forms for cohort-scale summaries, drawn with the kit's chart layer, on synthetic data." }, (ga) => {
  const tok = (n) => getComputedStyle(document.documentElement).getPropertyValue(`--${n}`).trim();
  const ramp = (h, steps) => steps.map((s) => tok(`${h}-${s}`));
  const rnd = GA.rng(41);

  ga.text("LAMINA · CHART SPECIMENS IV · SYNTHETIC DATA", { x: ga.M, y: 40, role: "kicker", at: 0 });
  ga.text("Cohorts at a glance, one grammar", { x: ga.M, y: 64, role: "title", size: 34, at: 0 });
  ga.hrule(118);

  const GUT = 40, CW = (1600 - 2 * ga.M - 2 * GUT) / 3;
  const cell = (i) => ({ x: ga.M + i * (CW + GUT), T: 138 });
  const head = (c, n, name) => ga.text(`${String(n).padStart(2, "0")} · ${name}`, { x: c.x, y: c.T, role: "step", at: 0.2 });
  const note = (c, s) => ga.text(s, { x: c.x, y: 722, w: CW, role: "cap", size: 14, at: 0.4 });
  const at = 0.3;

  const types = ["Breast", "Lung", "Colorectal", "Liver", "Pancreas", "Prostate", "Ovary", "Kidney", "Melanoma", "Glioma"];

  // 18 count matrix: patients with a driver in each gene, per tumour type
  {
    const c = cell(0); head(c, 18, "COUNT MATRIX");
    const genes = ["TP53", "CDKN2A", "KRAS", "PIK3CA", "PTEN", "ARID1A", "TERT", "APC", "BRAF", "RB1", "NF1", "CTNNB1", "VHL", "IDH1"];
    const nType = [198, 86, 60, 326, 241, 286, 113, 144, 107, 41];
    // propensity of each gene in each type (0 = never), to make a plausible pattern
    const hot = { TP53: [.35, .8, .6, .3, .7, .1, .95, .05, .15, .3], CDKN2A: [.03, .4, .05, .15, .6, .02, .03, .1, .45, .5], KRAS: [0, .3, .45, .02, .9, .01, .02, 0, .02, 0],
      PIK3CA: [.35, .1, .15, .02, .02, .02, .05, .02, .02, .1], PTEN: [.05, .05, .05, .02, .01, .15, .03, .03, .1, .45], ARID1A: [.05, .06, .1, .12, .06, .02, .1, .02, .03, .02],
      TERT: [.02, .05, 0, .5, .01, .01, .02, .1, .7, .8], APC: [0, .02, .8, .02, .01, .02, 0, 0, .02, 0], BRAF: [.01, .06, .1, 0, .02, 0, .01, 0, .5, .05],
      RB1: [.03, .1, .02, .05, .01, .02, .04, 0, .02, .1], NF1: [.03, .1, .03, .01, .01, .01, .08, .02, .2, .1], CTNNB1: [0, .01, .05, .3, .01, .01, .02, 0, .02, 0],
      VHL: [0, 0, 0, 0, 0, 0, 0, .6, 0, 0], IDH1: [0, 0, 0, .05, 0, 0, 0, 0, 0, .3] };
    const M = genes.map((g) => nType.map((n, j) => Math.round(n * hot[g][j] * (0.7 + 0.6 * rnd()))));
    const totals = M.map((r) => r.reduce((a, b) => a + b, 0));
    const order = genes.map((_, i) => i).sort((a, b) => totals[b] - totals[a]);
    const parts = { TP53: [.8, 0, .2], CDKN2A: [.15, 0, .85], KRAS: [.95, .05, 0], PIK3CA: [.9, .1, 0], PTEN: [.4, 0, .6], ARID1A: [.7, 0, .3], TERT: [.2, .8, 0], APC: [.9, 0, .1], BRAF: [.97, .03, 0], RB1: [.3, 0, .7], NF1: [.6, 0, .4], CTNNB1: [1, 0, 0], VHL: [.7, 0, .3], IDH1: [1, 0, 0] };
    const q = ramp("teal", [100, 200, 400, 700, 900]);
    const ch = GA.chart(ga, { x: c.x + 64, y: c.T + 108, w: 240, h: 14 * 19, axes: "", at });
    const pc = [tok("cat-1"), tok("cat-2"), tok("cat-5")];
    ch.counts(order.map((i) => M[i]), q, {
      bins: [0, 0.05, 0.1, 0.2, 0.4, 1], dark: 3, shade: (v, i, j) => v / nType[j],
      rowLabels: order.map((i) => genes[i]), colLabels: types,
      totals: order.map((i) => totals[i]), totalsTitle: "Total",
      parts: order.map((i) => parts[genes[i]]), partColors: pc, partW: 96,
    });
    // binned key: one swatch per bin, the edges between them
    const kx = c.x + 318, ky = c.T + 38, kw = 26;
    ga.text("Share of patients", { x: kx, y: ky - 20, role: "tick", color: "var(--muted)", at, anim: "fade" });
    ga.raw(q.map((col, i) => `<rect x="${kx + i * kw}" y="${ky}" width="${kw - 2}" height="10" fill="${col}"/>`).join(""), { at, anim: "fade" });
    ["0", ".05", ".1", ".2", ".4", "1"].forEach((s, i) => ga.text(s, { x: kx + i * kw - 1, y: ky + 14, role: "tick", size: 11, anchor: "middle", at, anim: "fade" }));
    ch.dotKey([{ label: "mutation", color: pc[0] }, { label: "amplification", color: pc[1] }, { label: "deletion", color: pc[2] }], { x: c.x, y: ch.y1 + 44, square: true });
    note(c, "Counts are the data, so each cell prints its count; the shade bins its share of the column's patients (5 steps, edges on the key). Blank means none. Rows sort by total; a 100 % bar per row splits it by mechanism.");
  }

  // 19 dot matrix: prevalence (area) and burden (colour) of each signature per type
  {
    const c = cell(1); head(c, 19, "DOT MATRIX");
    const sigs = ["SBS1", "SBS2", "SBS4", "SBS5", "SBS7a", "SBS13", "SBS17b", "SBS40", "DBS1", "DBS2", "ID1", "ID2", "ID3"];
    const notes = ["5mC deamination", "APOBEC activity", "Tobacco smoking", "Clock-like", "Ultraviolet light", "APOBEC activity", "Unknown", "Clock-like", "Ultraviolet light", "Tobacco smoking", "Replication slippage", "Replication slippage", "Tobacco smoking"];
    const cols = types.slice(0, 9), n = [198, 86, 60, 326, 241, 286, 113, 144, 107];
    const where = { SBS4: [1], SBS7a: [8], DBS1: [8], DBS2: [1, 3], SBS17b: [3, 2], ID3: [1] };
    const share = [], mag = [];
    sigs.forEach((s, i) => {
      share.push(cols.map((_, j) => {
        if (where[s]) return where[s].includes(j) ? 0.5 + 0.5 * rnd() : rnd() < 0.15 ? 0.1 * rnd() : 0;
        if (["SBS1", "SBS5", "SBS40", "ID1", "ID2"].includes(s)) return 0.6 + 0.4 * rnd();
        return rnd() < 0.6 ? rnd() * 0.8 : 0;
      }));
      mag.push(cols.map((_, j) => (where[s] && where[s].includes(j) ? 5 + 20 * rnd() : 0.05 + 2 * rnd() ** 2)));
    });
    const q = ramp("teal", [300, 400, 500, 600, 700, 800, 900]);
    const ch = GA.chart(ga, { x: c.x + 84, y: c.T + 118, w: 198, h: 13 * 20 + 20, axes: "", at });
    const dm = ch.dotMatrix(share, mag, q, {
      domain: [0.05, 25], log: true, rowLabels: sigs, colLabels: cols, n, notes,
      groups: [{ label: "SBS", n: 8 }, { label: "DBS", n: 2 }, { label: "ID", n: 3 }], groupX: c.x + 4,
    });
    ch.sizeKey([0.25, 0.5, 1], dm.rmax, { x: c.x + 84, y: ch.y1 + 22, title: "Share of tumours" });
    ga.text("Mutations per Mb", { x: c.x + 250, y: ch.y1 + 22, role: "tick", color: "var(--muted)", at, anim: "fade" });
    ch.key(q, { x: c.x + 250, y: ch.y1 + 48, w: 150, lo: ".05", hi: "> 25" });
    note(c, "Two measures per cell: the dot's area is the share of tumours with the signature, its colour the burden among them (log, capped). Every cell is a wash square, so an empty cell reads as measured and absent. Groups part with a gap; notes sit right.");
  }

  // 21 radial track stack: drivers per patient, grouped by tumour type
  {
    const c = cell(2); head(c, 21, "RADIAL TRACK STACK");
    const sizes = [58, 44, 40, 62, 50, 54, 36, 42, 38, 30];
    const R = GA.radial(ga, { cx: c.x + 206, cy: c.T + 262, r: 116, groups: types.map((l, k) => ({ label: l, n: sizes[k] })), at });
    // per patient: counts of five driver classes; the bar ring is their sum
    const pts = [];
    sizes.forEach((n, k) => {
      const grp = Array.from({ length: n }, () => {
        const v = [rnd() < 0.15 ? 1 : 0, Math.floor(rnd() * rnd() * 4), Math.floor(rnd() * (2 + (k % 3)) * rnd() * 3), Math.floor(rnd() * 3), Math.floor(rnd() * rnd() * (k === 8 ? 10 : 5))];
        return { v, tot: v.reduce((a, b) => a + b, 0) };
      }).sort((a, b) => b.tot - a.tot);
      pts.push(...grp);
    });
    R.sectors({ depth: 5, labelR: 116 + 5 + 3 + 26 + 8 });
    R.bars(pts.map((p) => p.tot), { r0: 116 + 5 + 3, depth: 26 });
    // germline is present or absent: one step; counts take four steps of their hue
    const steps = [200, 400, 600, 800];
    const rings = [
      { label: "Germline", ramp: ramp("slate", [500]) }, { label: "Structural variants", ramp: ramp("ochre", steps) }, { label: "Copy number", ramp: ramp("blue", steps) },
      { label: "Non-coding", ramp: ramp("violet", steps) }, { label: "Coding", ramp: ramp("moss", steps) },
    ];
    rings.forEach((rg, k) => R.ring(pts.map((p) => p.v[k]), rg.ramp, { depth: 11, domain: [1, k === 0 ? 1 : 6] }));
    R.key(rings, { x: c.x + 290, y: c.T + 452, w: 56, lo: "1", hi: "6+" });
    ga.text("Rings, outside in", { x: c.x + 290, y: c.T + 430, role: "tick", color: "var(--muted)", at, anim: "fade" });
    note(c, "Patients run clockwise in sectors by tumour type, sorted by total within each. The outer bars sum the drivers (one tick, in the opening at 12 o'clock); each inner ring is one driver class on its own hue's ramp. Blank means none.");
  }
});
</script>
</body>
</html>
