<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kare chart forms 03, 15, 16</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit/ga-kit.css">
<script src="../kit/icons.js"></script>
<script src="../kit/ga-kit.js"></script>
<script src="../kit/ga-charts.js"></script>
</head>
<body>
<script>
// Specimen sheet for core/charts/: Kaplan-Meier by risk group and with
// numbers at risk (03), predicted vs observed (15) and the dumbbell (16).
// All data here are synthetic.
GA.build({ duration: 8, poster: 7.5, title: "kare chart forms 03, 15, 16", desc: "Survival, prediction and paired-comparison forms drawn with the kit's chart layer, on synthetic data." }, (ga) => {
  const tok = (n) => getComputedStyle(document.documentElement).getPropertyValue(`--${n}`).trim();
  const ramp = (h, steps) => steps.map((s) => tok(`${h}-${s}`));
  const rnd = GA.rng(23);
  const normal = (mu = 0, sd = 1) => mu + sd * Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(2 * Math.PI * rnd());

  ga.text("LAMINA · CHART SPECIMENS III · SYNTHETIC DATA", { x: ga.M, y: 40, role: "kicker", at: 0 });
  ga.text("Clinical forms, one grammar", { x: ga.M, y: 64, role: "title", size: 34, at: 0 });
  ga.hrule(118);

  // 3 x 2 cells; the last spans two columns
  const GUT = 48, CW = (1600 - 2 * ga.M - 2 * GUT) / 3;
  const cell = (i) => ({ x: ga.M + (i % 3) * (CW + GUT), T: i < 3 ? 138 : 506 });
  const head = (c, n, name) => ga.text(`${String(n).padStart(2, "0")} · ${name}`, { x: c.x, y: c.T, role: "step", at: 0.2 });
  const note = (c, s, w = CW, dy = 298) => ga.text(s, { x: c.x, y: c.T + dy, w, role: "cap", size: 14, at: 0.4 });
  const at = 0.3;

  // Kaplan-Meier estimate of exponential survival with uniform censoring.
  // Returns the step points, the censoring marks and the numbers at risk.
  const km = (n, rate, end = 60) => {
    const obs = Array.from({ length: n }, () => {
      const t = -Math.log(1 - rnd()) / rate, c = 12 + rnd() * 70;
      return t <= Math.min(c, end) ? { t, e: 1 } : { t: Math.min(c, end), e: 0 };
    }).sort((a, b) => a.t - b.t);
    let s = 1, atRisk = n, v = 0;
    const pts = [[0, 1]], cens = [], band = [[0, 1, 1]];
    for (const o of obs) {
      if (o.e) {
        v += 1 / (atRisk * Math.max(1, atRisk - 1));
        s *= 1 - 1 / atRisk;
        pts.push([o.t, s]);
        const se = s * Math.sqrt(v);
        band.push([o.t, Math.max(0, s - 1.96 * se), Math.min(1, s + 1.96 * se)]);
      } else if (o.t < end) cens.push([o.t, s]);
      atRisk--;
    }
    pts.push([end, s]); band.push([end, ...band.at(-1).slice(1)]);
    const risk = (t) => obs.filter((o) => o.t >= t).length;
    return { pts, cens, band, risk };
  };
  const pct = (v) => `${Math.round(v * 100)}%`;

  // 03 Kaplan-Meier by risk group: ordered groups on the valence arms
  {
    const c = cell(0); head(c, 3, "KAPLAN–MEIER, RISK GROUPS");
    const ch = GA.chart(ga, { x: c.x + 52, y: c.T + 76, w: CW - 68, h: 160, xd: [0, 60], yd: [0, 1], xTicks: [0, 12, 24, 36, 48, 60], yTicks: [0, 0.5, 1], yFmt: pct, xTitle: "Months from landmark", yTitle: "Overall survival", at });
    const groups = [
      { label: "Q1", rate: 0.004, color: tok("blue-700") },
      { label: "Q2", rate: 0.009, color: tok("blue-400") },
      { label: "Q3", rate: 0.015, color: tok("vermilion-400") },
      { label: "Q4", rate: 0.05, color: tok("vermilion-700") },
    ];
    for (const g of groups) {
      const k = km(140, g.rate);
      ch.line(k.pts, { curve: "step", color: g.color });
      ch.censor(k.cens, { color: g.color });
    }
    // key above the plot, in group order: the curves cross, so no end labels
    let kx = c.x + 170;
    for (const g of groups) {
      ga.raw(`<path d="M${kx} ${c.T + 55}h18" stroke="${g.color}" stroke-width="2.5" stroke-linecap="round"/>`, { at, anim: "fade" });
      const t = ga.text(g.label, { x: kx + 24, y: c.T + 46, role: "tick", at, anim: "fade" });
      kx = t.r + 16;
    }
    ["n = 560", "*P* = 3 × 10⁻⁴²", "C-index 0.78"].forEach((s, i) => ga.text(s, { x: ch.x0 + 10, y: ch.sy(0.3) + i * 17, role: "cap", size: 13, at: at + 1.4, anim: "fade" }));
    note(c, "Risk quartiles are ordered and carry valence: benefit 700 and 400, harm 400 and 700. Ticks mark censoring; n, the log-rank P and the C-index sit in the empty corner.");
  }

  // 03 Kaplan-Meier with numbers at risk: focus against comparator
  {
    const c = cell(1); head(c, 3, "KAPLAN–MEIER, NUMBERS AT RISK");
    const ch = GA.chart(ga, { x: c.x + 96, y: c.T + 60, w: CW - 186, h: 118, xd: [0, 60], yd: [0, 1], xTicks: [0, 12, 24, 36, 48, 60], yTicks: [0, 0.5, 1], yFmt: pct, xTitle: "Months from landmark", yTitle: "Overall survival", at });
    const hi = km(150, 0.04), lo = km(450, 0.008);
    ch.ribbon(hi.band.map(([x, l]) => [x, l]), hi.band.map(([x, , u]) => [x, u]), { curve: "step", color: "var(--harm)" });
    ch.line(lo.pts, { curve: "step", color: "var(--context)" });
    ch.line(hi.pts, { curve: "step", color: "var(--harm)" });
    ch.censor(lo.cens, { color: "var(--context)" });
    ch.censor(hi.cens, { color: "var(--harm)" });
    ch.label("high risk", 60, hi.pts.at(-1)[1], { dx: 10, color: "var(--harm-text)" });
    ch.label("other", 60, lo.pts.at(-1)[1], { dx: 10, color: "var(--muted)" });
    const times = [0, 12, 24, 36, 48, 60];
    ch.atRisk([
      { label: "high risk", counts: times.map(hi.risk), color: "var(--harm-text)" },
      { label: "other", counts: times.map(lo.risk), color: "var(--muted)" },
    ], times, { y: ch.y1 + 74 });
    note(c, "The focus group carries a step-shaped 95% CI ribbon; the comparator is context grey. Numbers at risk sit beneath the axis in the tick role, rows named in each series' text colour.");
  }

  // 15 predicted vs observed: density bins, identity line, marginal strips
  {
    const c = cell(2); head(c, 15, "PREDICTED VS OBSERVED");
    const ch = GA.chart(ga, { x: c.x + 44, y: c.T + 100, w: 142, h: 142, xd: [1, 5], yd: [1, 5], xTicks: [1, 3, 5], yTicks: [1, 3, 5], xTitle: "Measured (g/dL)", at });
    ga.text("Predicted (g/dL)", { x: ch.x0, y: c.T + 34, role: "axis", at, anim: "fade" });
    const pts = Array.from({ length: 5000 }, () => {
      const x = rnd() < 0.8 ? normal(3.9, 0.35) : normal(3.0, 0.6);
      return [x, 0.75 * x + 0.95 + normal(0, 0.22)];
    });
    const q = ramp("teal", [100, 200, 300, 400, 500, 600, 700, 800, 900]);
    ch.hexbin(pts, q, { r: 5, domain: [1, 150] });
    ch.ref("diag");
    ch.marginal("top", pts.map((p) => p[0]), { bins: 20, peak: true });
    ch.marginal("right", pts.map((p) => p[1]), { bins: 20, peak: true });
    ["n = 5,000", "MAE 0.21 g/dL", "RMSE 0.29 g/dL"].forEach((s, i) => ga.text(s, { x: ch.x1 - 4, y: ch.y1 - 50 + i * 16, role: "cap", size: 12, anchor: "end", at: at + 1.2, anim: "fade" }));
    ch.key(q, { x: ch.x1 + 60, y: ch.y1 - 30, w: 120, lo: "1", hi: "> 150" });
    ga.text("measurements per bin", { x: ch.x1 + 60, y: ch.y1 - 52, role: "tick", at, anim: "fade" });
    note(c, "Square plot, one scale on both axes, dotted identity line. Density on the quantity ramp, capped. Marginal strips share the axes, carry one tick at a round number just above their peak and no title.");
  }

  // 16 dumbbell: exact P, values at the ends
  {
    const c = cell(3); head(c, 16, "DUMBBELL, PAIRED COMPARISON");
    const ch = GA.chart(ga, { x: c.x + 172, y: c.T + 62, w: CW - 282, h: 170, xd: [0.5, 0.9], xTicks: [0.5, 0.7, 0.9], xFmt: (v) => v.toFixed(2), xTitle: "C-index", axes: "x", at });
    ch.dumbbell([
      { label: "Ovarian, NACT (227)", a: 0.59, b: 0.64, p: 0.16 },
      { label: "Renal cell (285)", a: 0.62, b: 0.67, p: 0.13 },
      { label: "DLBCL (93)", a: 0.63, b: 0.67, p: 0.68 },
      { label: "Hepatocellular (174)", a: 0.64, b: 0.72, p: 0.02 },
      { label: "Ovarian, adjuvant (92)", a: 0.73, b: 0.82, p: 0.009 },
    ], { values: true, p: "exact", pRight: c.x + CW - 24 });
    ch.dotKey([{ label: "clinical score", color: "var(--context)" }, { label: "model", color: "var(--prussian)" }], { x: c.x + 172, y: c.T + 26 });
    note(c, "Comparator in context grey, model in prussian, a rule stem between. Values at the outer ends; the exact *P* right-aligned in one column. The axis spans the data. A hollow model dot means *P* ≥ 0.05.");
  }

  // 16 dumbbell, dense: stars, small multiples at one row pitch
  {
    const c = cell(4); head(c, 16, "DUMBBELL, DENSE");
    const SW = (2 * CW + GUT) / 2;
    const multiples = [
      { name: "Immunotherapy", rows: [
        { label: "Pembrolizumab, carboplatin", a: 0.61, b: 0.65, p: 0.08 },
        { label: "Pembrolizumab post-platinum", a: 0.65, b: 0.655, p: 0.03 },
        { label: "Ipilimumab, nivolumab", a: 0.62, b: 0.70, p: 0.004 },
        { label: "Pembrolizumab, pemetrexed", a: 0.645, b: 0.70, p: 0.0004 },
        { label: "Pembrolizumab, first line", a: 0.64, b: 0.70, p: 0.02 },
      ] },
      { name: "Targeted therapy", rows: [
        { label: "Alectinib", a: 0.66, b: 0.645, p: 0.4 },
        { label: "Osimertinib", a: 0.66, b: 0.695, p: 0.0006 },
        { label: "Crizotinib", a: 0.67, b: 0.72, p: 0.03 },
        { label: "Imatinib", a: 0.665, b: 0.77, p: 0.0002 },
      ] },
    ];
    const pitch = 30;
    multiples.forEach((g, k) => {
      const x = c.x + k * SW + 196, w = SW - 196 - 64, h = g.rows.length * pitch;
      const ch = GA.chart(ga, { x, y: c.T + 90, w, h, xd: [0.6, 0.8], xTicks: [0.6, 0.7, 0.8], xFmt: (v) => v.toFixed(1), xTitle: k === multiples.length - 1 ? "C-index" : undefined, axes: "x", at });
      ga.text(g.name, { x: c.x + k * SW, y: c.T + 58, role: "label", size: 15, at, anim: "fade" });
      ch.dumbbell(g.rows, { pitch, p: "stars", pRight: x + w + 28 });
      if (k === 0) ch.dotKey([{ label: "before treatment", color: "var(--context)" }, { label: "on treatment", color: "var(--prussian)" }], { x: c.x + 196, y: c.T + 26 });
    });
    note(c, "Many comparisons in one space: stars stand in for *P* (one for < 0.05, two for < 0.01, three for < 0.001; ns otherwise), right-aligned in one column and defined in the legend, with the exact values in a supplementary table. Values drop; the shared axis reads them. Small multiples keep one row pitch, so a short group ends early.", 2 * CW + GUT);
  }
});
</script>
</body>
</html>
