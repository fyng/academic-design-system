<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamina chart specimens VI</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../formats/abstract/kit/ga-kit.css">
<script src="../formats/abstract/kit/icons.js"></script>
<script src="../formats/abstract/kit/ga-kit.js"></script>
<script src="../formats/abstract/kit/ga-bio.js"></script>
<script src="../formats/abstract/kit/ga-charts.js"></script>
</head>
<body>
<script>
// Specimen sheet for core/charts.md: findings placed on the body. The body map (22)
// with site bubbles and with region dials, and a route map (23) paired with its
// clone tree (24). All data here are synthetic.
GA.build({ duration: 8, poster: 7.5, title: "Lamina chart specimens VI", desc: "Anatomical findings drawn as glyphs on a neutral body: site bubbles, region dials, seeding routes and the clone tree they come from, on synthetic data." }, (ga) => {
  const tok = (n) => getComputedStyle(document.documentElement).getPropertyValue(`--${n}`).trim();
  const B = GA.bio(ga);
  const at = 0.3, T = 138;
  ga.text("LAMINA · CHART SPECIMENS VI · SYNTHETIC DATA", { x: ga.M, y: 40, role: "kicker", at: 0 });
  ga.text("Findings where they are in the body", { x: ga.M, y: 64, role: "title", size: 34, at: 0 });
  ga.hrule(118);
  const note = (x, w, s) => ga.text(s, { x, y: 722, w, role: "cap", size: 14, at: 0.4 });

  // 22 body map: metastases per site. Registered organs keep their colour; other
  // sites are ink-2.
  {
    const x = ga.M, CW = 470;
    ga.text("22 · BODY MAP", { x, y: T, role: "step", at: 0.2 });
    const body = B.body({ cx: x + CW / 2, y: T + 44, h: 520, at });
    const org = (n) => tok(`organ-${n}`), ink2 = tok("ink-2");
    B.bubbles(body, [
      { site: "brain", n: 22, color: ink2, label: "Brain" },
      { site: "lymph node", n: 68, color: ink2, label: "Lymph node", side: "l" },
      { site: "lung L", n: 125, color: org("lungs"), label: "Lung" },
      { site: "bone", n: 7, color: ink2, label: "Bone" },
      { site: "cardiac", n: 15, color: ink2, label: "Cardiac" },
      { site: "pleura", n: 3, color: ink2, label: "Pleura" },
      { site: "liver", n: 33, color: org("liver"), label: "Liver" },
      { site: "adrenal", n: 17, color: org("adrenal"), label: "Adrenal" },
      { site: "kidney", n: 7, color: org("kidney"), label: "Kidney" },
      { site: "peritoneum", n: 31, color: ink2, label: "Peritoneum" },
      { site: "large bowel", n: 7, color: org("colon"), label: "Large bowel" },
      { site: "soft tissue", n: 23, color: ink2, label: "Soft tissue" },
      { site: "subcutaneous", n: 2, color: org("skin"), label: "Subcutaneous" },
    ], { rmax: 26, max: 125, at: at + 0.3 });
    note(x, CW, "A neutral body carries the sites. Each bubble's area is its count, printed inside (beside the name when the bubble is too small). Names sit in two columns on leaders. A registered organ keeps its colour; any other site is ink-2.");
  }

  // 22 body map, region dials: one dial per region, the share that seeds
  {
    const x = ga.M + 520, CW = 330;
    ga.text("22 · BODY MAP, REGION DIALS", { x, y: T, role: "step", at: 0.2 });
    const body = B.body({ cx: x + 150, y: T + 70, h: 470, at });
    const intra = { x: x + 150 - 30, y: body.site("lung R").y + 8 }, extra = { x: x + 150 + 20, y: body.site("small bowel").y + 12 };
    B.dial({ ...intra, r: 38, share: [32, 121], ring: tok("cat-5"), color: tok("teal-600"), at: at + 0.3 });
    B.dial({ ...extra, r: 38, share: [19, 137], ring: tok("cat-2"), color: tok("teal-600"), at: at + 0.3 });
    // each region named beside its dial, in its text step, on a paper halo
    const name = (str, p, dy, k) => {
      const it = ga.text(str, { x: p.x, y: p.y + dy, role: "tick", size: 13, anchor: "middle", color: tok(`cat-${k}-text`), at, anim: "fade" });
      it.node.querySelectorAll("text").forEach((t) => t.setAttribute("style", `${t.getAttribute("style")};stroke:var(--paper);stroke-width:3px;paint-order:stroke`));
    };
    name("Intrathoracic", intra, -66, 5);
    name("Extrathoracic", extra, 48, 2);
    // the test between the two regions, as a bracket beside them
    const bx = x + 262;
    ga.raw(`<path d="M${bx - 5} ${intra.y}H${bx}V${extra.y}H${bx - 5}" stroke="var(--ink-2)" stroke-width="1.5" fill="none"/>`, { at, anim: "fade" });
    ga.text("*P* = 0.013", { x: bx + 6, y: (intra.y + extra.y) / 2 - 8, role: "tick", size: 12, at, anim: "fade" });
    GA.glyphKey(ga, [{ kind: "circle", fill: tok("teal-600"), label: "seeding" }, { kind: "circle", fill: "var(--paper)", ring: "var(--context)", ringW: 1, label: "non-seeding" }], { x, y: body.bottom + 50, at });
    note(x, CW, "Regions, not sites: a dial per region, its ring in the region's colour and a wedge for the share that seeds, clockwise from 12 o'clock, with both counts inside. The test sits on a bracket.");
  }

  // 23 route map + 24 clone tree: one patient, colours shared between the two
  {
    const x = ga.M + 900, CW = 1600 - ga.M - x;
    ga.text("23 · ROUTE MAP  ·  24 · CLONE TREE", { x, y: T, role: "step", at: 0.2 });
    ga.text("Patient P-07", { x, y: T + 30, role: "label", size: 14, color: "var(--ink)", at, anim: "fade" });
    // location classes (where a clone lives) and seeding lineages (who seeded where)
    const trunk = tok("context"), shared = tok("blue-300"), prim = tok("blue-700");
    const A = tok("cat-2"), A2 = tok("ochre-300"), Bv = tok("cat-5"), B2 = tok("violet-300");
    const pos = GA.cloneTree(ga, {
      x: x + 16, y: T + 110, w: 250, h: 300, at,
      root: { id: "t", fill: trunk, children: [
        { id: "s1", fill: shared, children: [{ id: "p1", fill: prim, children: [{ id: "p2", fill: prim }] }, { id: "p3", fill: prim }] },
        { id: "s2", fill: shared, children: [
          { id: "A", fill: A, role: "P", children: [{ id: "a1", fill: A2 }, { id: "a2", fill: A2 }] },
          { id: "B", fill: Bv, role: "P", children: [{ id: "BM", fill: B2, role: "M", textColor: "var(--ink)", children: [{ id: "b1", fill: B2 }] }, { id: "b2", fill: B2 }] },
        ] },
      ] },
    });
    GA.glyphKey(ga, [
      { kind: "circle", size: 14, fill: trunk, label: "trunk" },
      { kind: "circle", size: 14, fill: shared, label: "shared subclone" },
      { kind: "circle", size: 14, fill: prim, label: "primary-unique" },
      { kind: "circle", size: 14, fill: "var(--paper)", ring: "var(--ink)", ringW: 2.5, text: "P", textColor: "var(--ink)", label: "seeds from the primary" },
      { kind: "circle", size: 14, fill: "var(--paper)", ring: "var(--muted)", ringW: 2.5, text: "M", textColor: "var(--ink)", label: "seeds from a metastasis" },
    ], { x: x + 16, y: T + 452, pitch: 22, at });
    // the route map
    const body = B.body({ cx: x + 455, y: T + 44, h: 540, at });
    const s = (n) => body.site(n);
    const mets = [
      { site: "liver", c: A }, { site: "adrenal", c: A }, { site: "lung L", c: Bv }, { site: "brain", c: B2 }, { site: "soft tissue", c: B2 },
    ];
    GA.routes(ga, [
      { from: s("lung R"), to: s("liver"), color: A }, { from: s("lung R"), to: s("adrenal"), color: A },
      { from: s("lung R"), to: s("lung L"), color: Bv }, { from: s("lung L"), to: s("brain"), color: tok("violet-400") }, { from: s("lung L"), to: s("soft tissue"), color: tok("violet-400") },
    ], { at: at + 0.6, bow: 0.22 });
    let dots = mets.map((m) => GA.glyph("circle", s(m.site).x, s(m.site).y, { size: 13, fill: m.c })).join("");
    dots += GA.glyph("circle", s("lung R").x, s("lung R").y, { size: 16, fill: "var(--paper)", ring: "var(--ink)", ringW: 2.5 });
    ga.raw(dots, { at: at + 0.4, anim: "pop" });
    ga.text("primary", { x: s("lung R").x - 14, y: s("lung R").y - 8, role: "tick", size: 12, anchor: "end", color: "var(--ink-2)", at, anim: "fade" });
    note(x, CW, "The tree says which clones seeded; the body says where they went. Fill is where a clone lives, a ring and a letter its seeding role. Each seeding lineage takes one hue, lighter for its descendants, and its arrows share it: from the open primary to each site, bowing to one side.");
  }
});
</script>
</body>
</html>
